name: Migration release (throwaway)

# One-off: builds the app with the temporary legacy-import screen and publishes
# it as a pre-release. Runs only for pushes to the release/migration-import
# branch, never touches main, and is never merged.
on:
  push:
    branches:
      - release/migration-import

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: squiggle_flutter
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release

      - name: Package
        run: |
          tar -C build/linux/x64/release/bundle \
            -czf "${GITHUB_WORKSPACE}/squiggle_flutter/squiggle-linux-x64-v0.2.34-migration.tar.gz" .

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.34-migration \
            squiggle-linux-x64-v0.2.34-migration.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Squiggle v0.2.34 (with legacy import)" \
            --notes "Build of main (SQLite port, #162) plus a temporary screen shown at startup that imports canvases and images from the old file-based storage into the new database. The old files are left untouched, so the import can be re-run by deleting squiggle.db. Not for general use: this build is not on main." \
            --prerelease --latest=false
