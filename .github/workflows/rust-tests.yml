name: Rust tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: squiggle_rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: squiggle_rust

      - name: Test
        run: cargo test --workspace
