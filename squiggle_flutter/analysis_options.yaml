include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    always_use_package_imports: true
    directives_ordering: true

plugins:
  dart_code_linter:
    version: 4.4.0
    diagnostics:
      prefer-single-widget-per-file: warning
      member-ordering: warning
      prefer-match-file-name: warning
      prefer-extracting-callbacks: warning
      avoid-nested-conditional-expressions: warning
      avoid-banned-imports: warning

dart_code_linter:
  metrics:
    cyclomatic-complexity: 15
    maximum-nesting-level: 3
    source-lines-of-code: 60
    number-of-methods: 20
  metrics-exclude:
    - test/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
  rules-exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
  rules:
    - prefer-single-widget-per-file:
        severity: warning
        ignore-private-widgets: false
    - member-ordering:
        severity: warning
        alphabetize: false
        order:
          - constructors
          - fields
          - getters-setters
          - public-methods
          - private-methods
        widgets-order:
          - constructors
          - fields
          - getters-setters
          - init-state-method
          - did-change-dependencies-method
          - did-update-widget-method
          - dispose-method
          - build-method
          - public-methods
          - private-methods
    - prefer-match-file-name:
        severity: warning
        ignore-enums: true
        ignore-typedefs: true
        include:
          - lib/widgets/**
          - lib/**/widgets/**
    - prefer-extracting-callbacks:
        severity: warning
        allowed-line-count: 10
    - avoid-nested-conditional-expressions:
        severity: warning
    - avoid-banned-imports:
        severity: warning
        entries:
          - paths: ['lib/theme/.*\.dart$']
            deny: ['^package:squiggle_flutter/(app|document_library|editor|repositories|services|tools|widgets)/']
            message: 'Theme code must not depend on application behavior or widgets.'
          - paths: ['packages/data_models/lib/.*\.dart$']
            deny: ['^package:(flutter|squiggle_flutter)/']
            message: 'Persistence models must remain independent of Flutter and the application.'
